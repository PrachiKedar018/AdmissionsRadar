<p-table [value]="data" styleClass="custom-table" [rows]="10" 
        [paginator]="true">
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="student_id">ID <p-sortIcon field="student_id"></p-sortIcon></th>
            <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
            <th pSortableColumn="age">Age <p-sortIcon field="age"></p-sortIcon></th>
            <th pSortableColumn="gender">Gender <p-sortIcon field="gender"></p-sortIcon></th>
            <th pSortableColumn="desired_course">Desired Course <p-sortIcon field="desired_course"></p-sortIcon></th>
            <th pSortableColumn="eligible">Status <p-sortIcon field="eligible"></p-sortIcon></th>
            <th pSortableColumn="percentage">Aggregate <p-sortIcon field="percentage"></p-sortIcon></th>
            <th pSortableColumn="timestamp">Timestamp <p-sortIcon field="timestamp"></p-sortIcon></th>
            <th>Action</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-app>
        <tr class="table-row">
            <td class="font-semibold">{{app.student_id}}</td>
            <td class="font-medium">{{app.name}}</td>
            <td>{{app.age}}</td>
            <td>{{app.gender}}</td>
            <td>{{app.desired_course}}</td>
            <td>
                <span class="status-badge" [class.eligible]="app.eligible" [class.not-eligible]="!app.eligible">{{app.eligible ? 'Eligible':'Not Eligible'}}</span>
            </td>
            <td class="font-bold" [class.text-green]="app.eligible" [class.text-red]="!app.eligible">{{app.percentage}}%</td>
            <td class="small text-muted">{{app.timestamp | date:'short'}}</td>
            <td><button>click</button></td>
        </tr>
    </ng-template>
</p-table>
