<div class="container py-4 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
             <div class="luxury-card animate-fade-in">
              <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                  <h1 class="h3 mb-1">College Admission Eligibility Form</h1>
                  <p class="text-muted-small">Verify student eligibility dynamically before formal registration.</p>
                </div>
                <div class="badge-role">Counselor View</div>
              </div>
              <form [formGroup]="applyForm" (ngSubmit)="onSubmit()">
                <app-student-info-form [form]="applyForm"/>
                <app-subject-marks-grid [form]="applyForm"/>
                <app-exam-qualification [form]="applyForm"/>
                <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top border-light">
                    <button type="button" class="btn btn-outline" [disabled]="!isLoading()">
                        Reset Form
                    </button>
                    <button type="submit"class="btn btn-primary" [disabled]="isLoading() || applyForm.invalid">
                        Submit
                    </button>
                </div>
              </form>
            </div>
            </div>
            </div>
